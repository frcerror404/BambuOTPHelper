version: '3.9'
services:
  bambu-otp-service:
    build: .
    container_name: bambu-otp-service
    environment:
      - PORT=3000
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - OTP_EXPIRATION_MINUTES=${OTP_EXPIRATION_MINUTES:-5}
      - IMAP_HOST=${IMAP_HOST:-imap.gmail.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - OTP_MQTT_URL=${OTP_MQTT_URL:-mqtts://mqtt-broker:8883}
      - OTP_MQTT_TOPIC=${OTP_MQTT_TOPIC:-bambu/otp}
      - OTP_MQTT_USERNAME=${OTP_MQTT_USERNAME}
      - OTP_MQTT_PASSWORD=${OTP_MQTT_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.bambu-otp.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.bambu-otp.entrypoints=websecure"
      - "traefik.http.routers.bambu-otp.tls=true"
      - "traefik.http.routers.bambu-otp.tls.certresolver=letsencrypt"
      - "traefik.http.services.bambu-otp.loadbalancer.server.port=3000"
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - traefik_proxy

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosq_config:/mosquitto/config
      - mosq_data:/mosquitto/data
    environment:
      - OTP_MQTT_USERNAME=${OTP_MQTT_USERNAME}
      - OTP_MQTT_PASSWORD=${OTP_MQTT_PASSWORD}
    command: >
      sh -c '
        set -e
        [ -f /mosquitto/config/mosquitto.conf ] || cat > /mosquitto/config/mosquitto.conf <<EOF
      persistence true
      persistence_location /mosquitto/data/
      log_dest stdout
      listener 1883 0.0.0.0
      allow_anonymous false
      password_file /mosquitto/config/passwordfile
      EOF
        [ -f /mosquitto/config/passwordfile ] || (mosquitto_passwd -b /mosquitto/config/passwordfile "$$OTP_MQTT_USERNAME" "$$OTP_MQTT_PASSWORD" && chmod 640 /mosquitto/config/passwordfile)
        exec mosquitto -c /mosquitto/config/mosquitto.conf
      '

volumes:
  mosq_config:
  mosq_data:

networks:
  traefik_proxy:
    external: true
