version: '3.9'
services:
  bambu-otp-service:
    build: .
    container_name: bambu-otp-service
    environment:
      - TZ=${TZ:-EST}
      - PORT=3000
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - OTP_EXPIRATION_MINUTES=${OTP_EXPIRATION_MINUTES:-5}
      - OTP_CONTROLLERS_ENABLED=${OTP_CONTROLLERS_ENABLED:-false}
      - IMAP_HOST=${IMAP_HOST:-imap.gmail.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - OTP_MQTT_URL=${OTP_MQTT_URL:-mqtt://mqtt-broker:1883}
      - OTP_MQTT_TOPIC=${OTP_MQTT_TOPIC:-bambu/otp}
      - OTP_MQTT_USERNAME=${OTP_MQTT_USERNAME}
      - OTP_MQTT_PASSWORD=${OTP_MQTT_PASSWORD}
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-password}
      - AUTH_SECRET=${AUTH_SECRET:-supersecretkey}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}"
      - "traefik.http.routers.bambu-otp.rule=Host(`${OTP_DOMAIN}`)"
      - "traefik.http.routers.bambu-otp.entrypoints=websecure"
      - "traefik.http.routers.bambu-otp.tls=true"
      - "traefik.http.routers.bambu-otp.tls.certresolver=le"
      - "traefik.http.services.bambu-otp.loadbalancer.server.port=3000"
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - traefik

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      - /root/docker-setup/mqtt/config:/mosquitto/config
      - /root/docker-setup/mqtt/data:/mosquitto/data
      - /root/docker-setup/mqtt/log:/mosquitto/log
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}

      # TLS MQTT router
      - traefik.tcp.routers.mqtts.rule=HostSNI(`${OTP_DOMAIN}`)
      - traefik.tcp.routers.mqtts.entrypoints=mqtts
      - traefik.tcp.routers.mqtts.tls=true
      - traefik.tcp.routers.mqtts.tls.certresolver=le
      - traefik.tcp.routers.mqtts.service=mqtt

      - traefik.tcp.services.mqtt.loadbalancer.server.port=1883

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik_proxy}
    external: true
